<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<h2>Welcome {{ role|capitalize }}</h2>

<!-- Common buttons -->
<a href="/upload" class="btn btn-success mt-3">Upload Excel</a>
<a href="/actual" class="btn btn-info mt-3">View Actual Log</a>

{% if role == 'admin' %}

    <!-- Admin-only buttons -->
    <a href="/customised" class="btn btn-warning mt-3">View Customised Log</a>
    <a href="/download" class="btn btn-secondary mt-3">Download Processed Excel</a>

    <!-- Download ALL employees report -->
    <a href="/download-report/all" class="btn btn-primary mt-3">
        Download Full Report
    </a>

    <!-- Download SINGLE employee report -->
    <form action="/download-report/employee" method="get" class="mt-3 row g-2 align-items-center">
        <div class="col-auto">
            <input type="text"
                   name="paycode"
                   class="form-control"
                   placeholder="Enter Paycode"
                   required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary">
                Download Employee Report
            </button>
        </div>
    </form>

{% endif %}

<!-- Logout button (common for all roles) -->
<a href="/logout" class="btn btn-danger mt-3">Logout</a>

</body>
</html>
